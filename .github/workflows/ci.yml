name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install noweb and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y noweb make

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry and black
        run: pipx install poetry && pipx install black

      - name: Install project (dev)
        run: poetry install --with dev

      - name: Tangle the literate sources
        run: make -C src/maventyr all

      - name: Run the test suite
        run: make -C tests test
